<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <title>Zoopolis</title>
</head>
<body>
<nav th:fragment="menu" class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container d-flex">
        <a class="navbar-brand" th:href="@{/}">Zoopolis</a>
        <ul class="navbar-nav d-flex flex-row ms-3">
            <li class="nav-item">
                <a class="nav-link" th:href="@{/animales}">Animales</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/clases}">Clases</a>
            </li>
        </ul>


        <ul class="navbar-nav d-flex flex-row ms-auto align-items-center">


            <li class="nav-item me-2" sec:authorize="!isAuthenticated()">
                <a th:href="@{/login}" class="btn btn-light btn-sm">Login</a>
            </li>
            <li class="nav-item" sec:authorize="!isAuthenticated()">
                <a th:href="@{/register}" class="btn btn-outline-light btn-sm">Register</a>
            </li>
            <li class="nav-item me-4">
                <span class="text-white" sec:authorize="isAuthenticated()" sec:authentication="name"></span>
            </li>
            <li class="nav-item" sec:authorize="isAuthenticated()">
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-danger btn-sm">Logout</button>
                </form>
            </li>
        </ul>
    </div>
</nav>
</body>
</html>
